server:
  port: 8080

spring:
  application:
    name: qingzhouyun
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVERS:localhost:8848}
        enabled: ${NACOS_ENABLED:false}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  redis:
    # 分布式锁/缓存: 未配置 Redis 时自动回退本地实现
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 3s
  # Quartz 集群调度: JDBC 存储 + isClustered, 共享库下定时任务跨节点只触发一次
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    properties:
      org.quartz.jobStore.tablePrefix: temporedata_guard_qrtz_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 5000
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.scheduler.instanceName: qingzhouyun-cluster
      org.quartz.threadPool.threadCount: 4

# 大数据存储抽象: local(本地磁盘, 默认) | s3(对象存储/MinIO 兼容)
storage:
  type: ${STORAGE_TYPE:local}
  local-dir: ${STORAGE_LOCAL_DIR:./data/files}
  endpoint: ${STORAGE_ENDPOINT:}
  bucket: ${STORAGE_BUCKET:qingzhouyun}
  token: ${STORAGE_TOKEN:}

# 分布式事件总线: direct(默认, 同步直连) | kafka(独立集群, 跨服务解耦)
event:
  bus:
    type: ${EVENT_BUS_TYPE:direct}

# Kafka(仅 event.bus.type=kafka 时启用)
spring.kafka:
  bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    group-id: qingzhouyun
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

# SpringDoc OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

zy:
  jwt:
    # 生产必须通过环境变量覆盖: ZY_JWT_SECRET (prod 下未设置将拒绝启动)
    secret: ${ZY_JWT_SECRET:dev-only-secret-key-change-in-production}
    expiration-ms: 86400000
  crypto:
    key: ${ZY_CRYPTO_KEY:qingzhouyun-p0-dev-key}
  cors:
    # 前端来源白名单(逗号分隔)
    allowed-origins: ${ZY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
  task:
    pool:
      # 异步任务线程池(采集/同步等长任务)
      core-size: 4
      max-size: 8
      queue-capacity: 2000
  datasource-pool:
    # 外部数据源连接池大小
    max-size: 8
  lock:
    # 分布式锁 TTL(秒), 跨节点协调时使用; 未配 Redis 时自动回退本地锁
    ttl-seconds: 14400
  search:
    # 情报检索引擎: database(默认) / elasticsearch(需配置 es-host)
    engine: ${ZY_SEARCH_ENGINE:database}
    es-host: ${ZY_SEARCH_ES_HOST:http://localhost:9200}
  ai:
    route:
      # 多模型场景路由(未配置则回落主模型)
      small-model: ${ZY_AI_SMALL_MODEL:}
      large-model: ${ZY_AI_LARGE_MODEL:}
      sql-model: ${ZY_AI_SQL_MODEL:}
    vector:
      # 语义检索向量库: memory(默认, 进程内) / pgvector(生产, 需 pgvector 扩展)
      engine: ${ZY_AI_VECTOR_ENGINE:memory}
      dim: 384

# 可观测性: Prometheus 指标
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

logging:
  level:
    root: info
    com.temporedata.guard: debug

---
# Dev profile: H2 embedded database
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/qingzhouyun;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

---
# Prod profile: MySQL with Flyway migration
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qingzhouyun}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    table: temporedata_guard_flyway_schema_history
  h2:
    console:
      enabled: false
  # 生产建议通过环境变量 ZY_JWT_SECRET 覆盖; 未设置时使用内置密钥(等保要求生产必须显式配置)
zy:
  jwt:
    secret: ${ZY_JWT_SECRET:qingzhouyun-prod-jwt-secret-key-0123456789abcdef0123456789abcdef}
  crypto:
    key: ${ZY_CRYPTO_KEY:}